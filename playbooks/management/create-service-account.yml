---
# Create Ansible service account for automation operations
# This playbook should be run after initial domain deployment

- name: Create Ansible service account
  hosts: all
  gather_facts: true

  tasks:
    - name: Validate service account password is provided
      ansible.builtin.assert:
        that:
          - ansible_service_password is defined
          - ansible_service_password | length > 0
        fail_msg: |
          Service account password must be provided via AAP credential or extra vars.
          Use AAP custom credential type 'Service Account Passwords' or:
          --extra-vars "ansible_service_password=YourPassword"
        success_msg: "Service account password validated"

    - name: Create Ansible service account
      ansible.builtin.include_role:
        name: management/user-accounts
      vars:
        ad_user_accounts: "{{ ansible_service_account_config }}"
