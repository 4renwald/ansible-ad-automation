---
- name: Local Administrator password reset
  become: false
  tags:
    - local-admin-password
    - never

  block:
    - name: Validate required parameters
      ansible.builtin.assert:
        that:
          - target_domain_admin_pass is defined
          - target_domain_admin_pass | length > 0
        fail_msg: "target_domain_admin_pass must be defined"
        success_msg: "Account management parameters validated"

    - name: Reset local Administrator password
      ansible.windows.win_user:
        name: Administrator
        password: "{{ target_domain_admin_pass }}"
        password_never_expires: true
        account_disabled: false
        state: present

  rescue:
    - name: Log account management error details
      ansible.builtin.debug:
        msg: |
          ❌ Account Management Failed
          Host: {{ inventory_hostname }}
          Error: {{ ansible_failed_result.msg | default('No error message') }}

    - name: Fail account management with context
      ansible.builtin.fail:
        msg: |
          Account management failed on {{ inventory_hostname }}.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
