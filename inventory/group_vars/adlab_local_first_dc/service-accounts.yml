---
# Service Accounts Configuration
# Store service account configurations that will be created after domain deployment
# Passwords should be provided via AAP credentials, not stored here

# Ansible Service Account
# Used for automated operations after initial domain deployment
# Password should be injected from AAP custom credential type
ansible_service_account_config:
  - name: "svc-ansible"
    upn: "svc-ansible@{{ target_domain_name }}"
    sam_account_name: "svc-ansible"
    firstname: "Ansible"
    surname: "Service Account"
    description: "Service account for Ansible Automation Platform operations"
    password: "{{ ansible_service_password }}"  # Injected from AAP credential
    enabled: true
    password_never_expires: true
    user_cannot_change_password: true
    path: "OU=ServiceAccounts,OU=Tier0,{{ domain_dc_path }}"
    groups:
      - "Domain Admins"

# Additional service accounts can be defined here
# Example:
# backup_service_account_config:
