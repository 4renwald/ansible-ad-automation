---
# Active Directory Domain Controllers Inventory
# Supports multiple domains with hierarchical group structure

all:
  vars:
    ansible_connection: psrp
    ansible_psrp_auth: credssp
    ansible_psrp_cert_validation: ignore
  children:
    # All domain controllers across all domains
    domain_controllers:
      children:
        # Domain: adlab.local
        adlab_local:
          children:
            adlab_local_first_dc:
              hosts:
                dc01.adlab.local:
                  ansible_host: 192.168.1.46

            adlab_local_additional_dcs:
              hosts:
                dc02.adlab.local:
                  ansible_host: 192.168.1.48
